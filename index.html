<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoClock | Driftocity</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a1128">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeoClock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --navy-950:#050914; --navy-900:#0a1128; --navy-800:#0f1a3a; --navy-700:#16234d; --navy-600:#1e2f63;
    --gold:#d4af37; --gold-bright:#f0cc5c; --text:#e8ecf7; --text-dim:#8b96b8;
    --green:#3ddc84; --red:#ff5c5c; --border:rgba(212,175,55,0.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Space Grotesk',sans-serif;background:radial-gradient(circle at 15% 10%, rgba(212,175,55,0.06), transparent 40%),radial-gradient(circle at 85% 90%, rgba(30,47,99,0.4), transparent 50%),var(--navy-950);color:var(--text);min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  header{display:flex;align-items:center;gap:10px;padding:18px 4px 22px;}
  .logo-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#a37e1e);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy-950);font-size:16px;box-shadow:0 0 0 1px var(--border), 0 4px 14px rgba(212,175,55,0.15);flex-shrink:0;}
  header h1{font-size:19px;margin:0;letter-spacing:0.2px;}
  header p{margin:0;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;text-transform:uppercase;}
  .circuit-line{height:1px;background:linear-gradient(90deg, transparent, var(--gold), transparent);opacity:0.4;margin:6px 0 20px;}
  .tabs{display:flex;gap:6px;background:var(--navy-900);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px;}
  .pick-list{display:flex;flex-direction:column;gap:10px;}
  .pick-btn{
    width:100%;text-align:left;padding:18px 20px;border-radius:12px;
    background:var(--navy-950);border:1.5px solid var(--border);color:var(--text);
    font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;cursor:pointer;
  }
  .pick-btn.selected{border-color:var(--gold);background:rgba(212,175,55,0.10);color:var(--gold-bright);}
  .big-status{text-align:center;padding:10px 6px 4px;}
  .big-status .icon{font-size:44px;line-height:1;margin-bottom:10px;}
  .big-status .headline{font-size:22px;font-weight:700;margin-bottom:6px;}
  .big-status .sub{font-size:14px;color:var(--text-dim);}
  .big-btn{padding:22px;font-size:19px;}
  .install-banner{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(135deg, rgba(212,175,55,0.12), rgba(212,175,55,0.04));
    border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;
  }
  .install-banner .icon{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .install-banner .text{flex:1;font-size:13px;line-height:1.35;}
  .install-banner .text strong{display:block;font-size:14px;margin-bottom:2px;}
  .install-banner button{flex-shrink:0;padding:9px 14px;font-size:12px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--navy-950);font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
  .install-banner .dismiss{background:none;border:none;color:var(--text-faint);font-size:18px;cursor:pointer;padding:4px 6px;flex-shrink:0;}

  /* PIN pad */
  .pin-display{display:flex;justify-content:center;gap:12px;margin:10px 0 22px;}
  .pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .1s;}
  .pin-dot.filled{background:var(--gold);border-color:var(--gold);}
  .pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pin-key{padding:20px 0;font-size:24px;font-weight:700;border-radius:12px;background:var(--navy-950);border:1px solid var(--border);color:var(--text);cursor:pointer;font-family:'Space Grotesk',sans-serif;}
  .pin-key:active{background:var(--navy-700);}
  .pin-key.wide{grid-column:span 1;font-size:14px;color:var(--text-dim);}

  /* Employee totals */
  .totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
  .totals-box{background:var(--navy-950);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
  .totals-box .num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--gold);}
  .totals-box .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}

  /* Map widget */
  .site-map{height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:12px;position:relative;}
  .map-view-toggle{position:absolute;top:8px;right:8px;z-index:1000;display:flex;background:rgba(5,9,20,0.85);border-radius:8px;overflow:hidden;border:1px solid rgba(212,175,55,0.3);}
  .map-view-toggle button{border:none;background:transparent;color:#e8ecf7;font-size:11px;font-weight:600;padding:6px 10px;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
  .map-view-toggle button.active{background:var(--gold);color:var(--navy-950);}
  .leaflet-container{background:var(--navy-900);font-family:'Space Grotesk',sans-serif;}

  /* PIN display in employee list */
  .emp-pin{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);background:var(--navy-950);border:1px solid var(--border);border-radius:6px;padding:3px 8px;letter-spacing:1px;}
  .emp-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--navy-950);}
  .emp-card:last-child{margin-bottom:0;}
  .emp-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .emp-card-name{font-size:15px;font-weight:700;}
  .emp-card-contact{font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.7;}
  .emp-card-contact .row-icon{display:inline-block;width:16px;color:var(--text-faint);}
  .emp-card-actions{display:flex;gap:6px;flex-wrap:wrap;}

  /* Toast for silent auto clock-in/out */
  .toast-slot{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;width:calc(100% - 32px);max-width:488px;}
  .toast{
    background:linear-gradient(135deg,var(--navy-800),var(--navy-900));border:1px solid var(--gold);border-radius:12px;
    padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,0.5);
    animation:toast-in .25s ease;
  }
  .toast .icon{font-size:20px;}
  .toast .msg{font-size:13.5px;color:var(--text);font-weight:600;}
  @keyframes toast-in{ from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }

  /* Photo capture */
  .photo-preview{width:100%;border-radius:12px;border:1px solid var(--border);margin-bottom:12px;display:block;max-height:220px;object-fit:cover;}
  .photo-btn{width:100%;padding:14px;border-radius:10px;border:1px dashed var(--border);background:var(--navy-950);color:var(--text-dim);font-size:14px;cursor:pointer;margin-bottom:12px;font-family:'Space Grotesk',sans-serif;}

  /* Clock mode radio cards (admin settings) */
  .mode-options{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .mode-option{border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;}
  .mode-option.selected{border-color:var(--gold);background:rgba(212,175,55,0.08);}
  .mode-option .title{font-size:14px;font-weight:700;margin-bottom:2px;}
  .mode-option .desc{font-size:12px;color:var(--text-dim);}
  .tab{flex:1;text-align:center;padding:10px 8px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-dim);transition:all .15s;user-select:none;}
  .tab.active{background:linear-gradient(135deg,var(--gold),#b8933a);color:var(--navy-950);}
  .card{background:linear-gradient(180deg, var(--navy-800), var(--navy-900));border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg, transparent, var(--gold), transparent);opacity:0.5;}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:0.8px;color:var(--gold);margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
  input[type=text], input[type=number], input[type=password], input[type=email], select{width:100%;background:var(--navy-950);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:9px;font-size:14px;font-family:'Space Grotesk',sans-serif;margin-bottom:14px;}
  input:focus, select:focus{outline:none;border-color:var(--gold);}
  .btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;letter-spacing:0.3px;transition:transform .1s, box-shadow .15s;}
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--navy-950);box-shadow:0 4px 16px rgba(212,175,55,0.25);}
  .btn-red{background:linear-gradient(135deg,#ff6b6b,#c73e3e);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-sm{padding:8px 12px;font-size:12px;width:auto;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;}
  .pill-in{background:rgba(61,220,132,0.12);color:var(--green);border:1px solid rgba(61,220,132,0.3);}
  .pill-out{background:rgba(139,150,184,0.12);color:var(--text-dim);border:1px solid var(--border);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .distance-box{display:flex;justify-content:space-between;align-items:center;background:var(--navy-950);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;}
  .distance-box .val{font-family:'JetBrains Mono',monospace;font-weight:600;}
  .in-range{color:var(--green);}
  .out-range{color:var(--red);}
  .entry-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .entry-row:last-child{border-bottom:none;}
  .entry-left{display:flex;flex-direction:column;gap:2px;}
  .entry-name{font-weight:600;}
  .entry-meta{color:var(--text-dim);font-size:11px;font-family:'JetBrains Mono',monospace;}
  .entry-hours{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--gold);font-size:13px;}
  .empty-state{text-align:center;color:var(--text-dim);font-size:13px;padding:20px 10px;}
  .site-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .site-row:last-child{border-bottom:none;}
  .site-info{font-size:13px;}
  .site-info .name{font-weight:600;}
  .site-info .meta{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .row2{display:flex;gap:10px;}
  .row2 > div, .row2 > input, .row2 > button{flex:1;}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;}
  .switch{position:relative;width:42px;height:24px;background:var(--navy-950);border:1px solid var(--border);border-radius:99px;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--gold);}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:left .15s;}
  .switch.on .knob{left:20px;background:var(--navy-950);}
  .msg{font-size:12px;padding:10px 12px;border-radius:9px;margin-bottom:14px;font-family:'JetBrains Mono',monospace;}
  .msg-error{background:rgba(255,92,92,0.1);color:var(--red);border:1px solid rgba(255,92,92,0.25);}
  .msg-success{background:rgba(61,220,132,0.1);color:var(--green);border:1px solid rgba(61,220,132,0.25);}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .summary-box{background:var(--navy-950);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .summary-box .num{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;color:var(--gold);}
  .summary-box .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
  a.export-link, a.text-link{color:var(--gold);font-size:12px;text-decoration:none;font-family:'JetBrains Mono',monospace;cursor:pointer;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .link-box{display:flex;gap:8px;background:var(--navy-950);border:1px solid var(--border);border-radius:9px;padding:10px 12px;align-items:center;margin-bottom:8px;}
  .link-box span{flex:1;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);word-break:break-all;}
  .switch-link{text-align:center;font-size:12px;color:var(--text-dim);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-mark">GC</div>
    <div>
      <h1>GeoClock</h1>
      <p>Driftocity Timekeeping</p>
    </div>
  </header>
  <div class="circuit-line"></div>

  <div id="install-banner-slot"></div>
  <div class="toast-slot" id="toast-slot"></div>

  <div class="tabs" id="tab-bar">
    <div class="tab active" data-tab="employee">Employee</div>
    <div class="tab" data-tab="admin">Admin</div>
  </div>

  <div id="employee-view"></div>
  <div id="admin-view" style="display:none;"></div>
  <div id="super-admin-view" style="display:none;"></div>
</div>

<script>
const TIER_INFO = {
  starter: { name: 'Starter', price: '$19.99', limit: 3, link: 'https://buy.stripe.com/aFa3cv9Tu7PocZJcx90000g' },
  team: { name: 'Team', price: '$39.99', limit: 10, link: 'https://buy.stripe.com/8x2bJ17Lm1r08Jt8gT0000h' },
  crew: { name: 'Crew', price: '$59.99', limit: 15, link: 'https://buy.stripe.com/14AcN54zab1A9Nx8gT0000i' }
};

// Login is intentionally NOT persisted across page loads - every time the
// app is opened, Admin requires a fresh email/password login. Clear out any
// token that may have been saved before this behavior was added.
localStorage.removeItem('gc_token');
let token = null;
let account = null;
let companyCode = new URLSearchParams(location.search).get('company') || localStorage.getItem('gc_company') || null;
if (companyCode) localStorage.setItem('gc_company', companyCode);

let sites = [];
let employees = [];
let teamMembers = [];
let entries = [];
let settings = {};

// Employee session - a real login now (4-digit PIN), never persisted, so
// every fresh page load requires logging in again. This also means an
// employee can only ever act as themselves, not pick any name off a list.
let employeeToken = null;
let employeeId = null;
let employeeName = '';
let pinEntry = '';
let pinError = '';
let privacyZone = null; // { lat, lng, radius } | null - employee's own no-track zone
let capturedPhoto = null; // base64 data URL staged for the next clock-in

// Live geofence watching - only active while the employee dashboard is
// open in this tab. Tracks entry/exit transitions and, depending on the
// business's Clock Mode setting, either asks the employee or clocks them
// in/out silently (like ConstructionClock's auto clock-in, but optional).
let geoWatchId = null;
let wasInsideAnySite = false;
let wasInsideActiveSite = true;
let geoPromptShown = false;

let selectedSiteId = null;
let adminScreen = 'login'; // 'login' | 'signup' | 'dashboard'
let editingSiteId = null;
let editingEntryId = null;
let editingEmployeeId = null;
let myClockInSiteId = null;
let myGeoWatchId = null;
let myWasInsideAnySite = false;
let myWasInsideActiveSite = true;
let myGeoPromptShown = false;
let siteMapInstance = null;
let siteMapMarker = null;
let siteMapCircle = null;

// ---------- install to home screen ----------
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
// Session-only, not saved to localStorage on purpose: this is often a
// shared device with multiple people logging in, and each of them should
// see the install prompt on their own login rather than it staying hidden
// forever after the first person dismisses it once.
let installDismissedThisSession = false;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallBanner();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

function shouldShowInstallBanner(){
  if(isStandalone || installDismissedThisSession) return false;
  return isIOS || !!deferredInstallPrompt;
}

function renderInstallBanner(){
  const slot = document.getElementById('install-banner-slot');
  if(!slot) return;

  if(!shouldShowInstallBanner()){
    slot.innerHTML = '';
    return;
  }

  slot.innerHTML = isIOS ? `
    <div class="install-banner" id="install-banner">
      <div class="icon">&#8593;</div>
      <div class="text"><strong>Add GeoClock to your Home Screen</strong>Tap the Share icon below, then "Add to Home Screen."</div>
      <button class="dismiss" id="dismiss-install">&times;</button>
    </div>` : `
    <div class="install-banner" id="install-banner">
      <div class="icon">&#8595;</div>
      <div class="text"><strong>Get GeoClock on your phone</strong>Install it for one-tap access, right from your home screen.</div>
      <button id="do-install">Install</button>
      <button class="dismiss" id="dismiss-install">&times;</button>
    </div>`;

  const dismissBtn = document.getElementById('dismiss-install');
  if(dismissBtn){
    dismissBtn.addEventListener('click', () => {
      installDismissedThisSession = true;
      slot.innerHTML = '';
    });
  }
  const installBtn = document.getElementById('do-install');
  if(installBtn){
    installBtn.addEventListener('click', async () => {
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      slot.innerHTML = '';
    });
  }
}

// ---------- API helper ----------
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || 'Request failed');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

async function employeeApi(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (employeeToken) headers['Authorization'] = 'Bearer ' + employeeToken;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || 'Request failed');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// ---------- utils ----------
function metersToFeet(m){ return m * 3.28084; }
function clientDistance(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function feetToMeters(ft){ return ft / 3.28084; }
function fmtDistance(m){
  const ft = metersToFeet(m);
  if(ft < 1000) return Math.round(ft) + " ft";
  return (ft/5280).toFixed(2) + " mi";
}
function fmtTime(iso){ return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString([], {month:'short', day:'numeric'}); }
function hoursBetween(a,b){ return (new Date(b) - new Date(a)) / 3600000; }
function toLocalInputValue(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ""; return d.innerHTML; }

function showToast(icon, message){
  const slot = document.getElementById('toast-slot');
  if(!slot) return;
  slot.innerHTML = `<div class="toast"><div class="icon">${icon}</div><div class="msg">${escapeHtml(message)}</div></div>`;
  setTimeout(() => {
    if(slot.firstChild) slot.innerHTML = '';
  }, 4500);
}

function compressPhoto(file, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getPosition(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation){ reject(new Error("Geolocation not supported on this device.")); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      err => reject(new Error(err.message || "Location access denied.")),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  });
}

function activeEntryForMe(){
  return entries.find(e => !e.clockOut);
}

// Keeps a device "logged in" ONLY while actually clocked in, so reopening
// the app (phone was locked, tab got closed) lands straight on the
// dashboard instead of the PIN screen - which matters because that's what
// lets auto-clock-out catch up immediately via the visibilitychange check.
// The moment someone clocks out, this is cleared immediately, so the
// device goes right back to requiring a PIN for whoever's next. This is
// deliberately different from remembering a name indefinitely (the old
// behavior we removed) - it only ever persists mid-shift.
function syncSessionPersistence(){
  if(!companyCode || !employeeToken) return;
  if(activeEntryForMe()){
    localStorage.setItem('gc_active_session', JSON.stringify({
      companyCode, employeeToken, employeeId, employeeName
    }));
  } else {
    localStorage.removeItem('gc_active_session');
  }
}

function totalHours(list){
  return list.reduce((sum, e) => e.clockOut ? sum + hoursBetween(e.clockIn, e.clockOut) : sum, 0);
}

function hoursThisWeek(list){
  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  return totalHours(list.filter(e => new Date(e.clockIn).getTime() >= weekAgo));
}

    <div class="card">

        <button class="pin-key" data-digit="0">0</button>
        <button class="pin-key wide" data-backspace="1">&larr;</button>
      </div>
    </div>

  document.querySelectorAll('[data-digit]').forEach(btn => {

      renderPinScreen(el);

async function handleClockIn(){

  if(!site) return;
  const btn = document.getElementById('clock-in-btn');

  if(settings.requirePhotoOnClockIn && !capturedPhoto){

    return;
  }
  btn.disabled = true;
  statusEl.innerHTML = `<div class="msg" style="color:var(--text-dim);font-size:14px;"><span class="spinner"></span> Checking that you're at the job site...</div>`;
  try{
    const coords = await getPosition();

      method: 'POST',
      body: JSON.stringify({ siteId: site.id, lat: coords.latitude, lng: coords.longitude, photo: capturedPhoto || undefined })
    });
    capturedPhoto = null;
    renderEmployee();
  }catch(err){

      statusEl.innerHTML = `<div class="msg msg-error" style="font-size:14px;">You're not close enough to ${escapeHtml(site.name)} yet (about ${fmtDistance(err.data.distance)} away). Move closer and try again.</div>`;

      statusEl.innerHTML = `<div class="msg msg-error" style="font-size:14px;">${escapeHtml(err.message)}</div>`;

    btn.disabled = false;
  }

async function handleClockOut(){
  const active = activeEntryForMe();
  if(!active) return;
  const statusEl = document.getElementById('geo-status-out');
  const btn = document.getElementById('clock-out-btn');
  btn.disabled = true;
  statusEl.innerHTML = `<div class="msg" style="color:var(--text-dim);font-size:14px;"><span class="spinner"></span> Clocking you out...</div>`;
  // Clock-out always works, from anywhere - it's the safety net for when
  // auto-clock-out doesn't fire. We still attach location if we can get it
  // quickly, but we never block on it or require it.
  let coords = null;
  try{ coords = await getPosition(); }catch(e){ /* fine - clock out anyway */ }
  try{
    await employeeApi(`/api/data?resource=entries&id=${active.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ lat: coords ? coords.latitude : undefined, lng: coords ? coords.longitude : undefined })
    });
    renderEmployee();
  }catch(err){
    statusEl.innerHTML = `<div class="msg msg-error" style="font-size:14px;">${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
  }
}

// ---------- live geofence watching ----------
// Only runs while this tab/app is open - the browser will not wake this up
// if the app is fully closed or the phone is locked for an extended time.
// That's a platform limit (iOS and Android both restrict background
// location for web apps), not a choice made here.
function startGeofenceWatch(){
  if(geoWatchId !== null || !navigator.geolocation) return;
  wasInsideAnySite = false;
  wasInsideActiveSite = true;
  geoWatchId = navigator.geolocation.watchPosition(handleGeoUpdate, () => {}, {
    enableHighAccuracy: true, maximumAge: 20000, timeout: 25000
  });
}

function stopGeofenceWatch(){
  if(geoWatchId !== null){
    navigator.geolocation.clearWatch(geoWatchId);
    geoWatchId = null;
  }
}

// iOS and Android both pause or throttle background location for web apps,
// so the passive watch above can miss the moment someone actually left a
// site while the phone was locked. To catch up fast, force one fresh
// position check the instant the app comes back to the foreground, rather
// than waiting for the next passive tick.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && geoWatchId !== null && navigator.geolocation){
    navigator.geolocation.getCurrentPosition(handleGeoUpdate, () => {}, {
      enableHighAccuracy: true, maximumAge: 0, timeout: 15000
    });
  }
});

function handleGeoUpdate(pos){
  if(geoPromptShown) return;

  // Never track or prompt inside the employee's own privacy zone (e.g. home).
  if(privacyZone){
    const insideZone = clientDistance(pos.coords.latitude, pos.coords.longitude, privacyZone.lat, privacyZone.lng) <= privacyZone.radius;
    if(insideZone) return;
  }

  const active = activeEntryForMe();

  if(active){
    const site = sites.find(s => s.id === active.siteId);
    if(!site) return;
    const inside = clientDistance(pos.coords.latitude, pos.coords.longitude, site.lat, site.lng) <= site.radius;
    if(!inside && wasInsideActiveSite){
      handleSiteExit(site, active);
    }
    wasInsideActiveSite = inside;
  } else {
    let foundInside = false;
    for(const site of sites){
      const inside = clientDistance(pos.coords.latitude, pos.coords.longitude, site.lat, site.lng) <= site.radius;
      if(inside){
        foundInside = true;
        if(!wasInsideAnySite){
          handleSiteEnter(site);
        }
        break;
      }
    }
    wasInsideAnySite = foundInside;
  }
}

// Clock Mode ('ask' vs 'auto') is set by the business admin in Settings.
// 'auto' silently clocks the employee in/out, like ConstructionClock's
// automatic tracking. 'ask' prompts first. Photo-required businesses always
// fall back to asking, since a photo needs the employee to actually take it.
async function handleSiteEnter(site){
  const mode = settings.autoMode || 'ask';
  if(mode === 'auto' && !settings.requirePhotoOnClockIn){
    geoPromptShown = true;
    try{
      const coords = await getPosition();
      await employeeApi('/api/data?resource=entries', {
        method: 'POST',
        body: JSON.stringify({ siteId: site.id, lat: coords.latitude, lng: coords.longitude })
      });
      showToast('&#9989;', `Automatically clocked in at ${site.name}`);
      renderEmployee();
    }catch(err){ /* stay quiet - they may just be a few feet outside still */ }
    geoPromptShown = false;
    return;
  }

  geoPromptShown = true;
  const wantsClockIn = confirm(`You've arrived at ${site.name}. Clock in now?`);
  if(wantsClockIn){
    selectedSiteId = site.id;
    await renderEmployee();
    setTimeout(() => {
      const btn = document.getElementById('clock-in-btn');
      if(btn) handleClockIn();
    }, 50);
  }
  geoPromptShown = false;
}

async function handleSiteExit(site, active){
  const mode = settings.autoMode || 'ask';
  if(mode === 'auto'){
    geoPromptShown = true;
    try{
      let coords = null;
      try{ coords = await getPosition(); }catch(e){}
      await employeeApi(`/api/data?resource=entries&id=${active.id}`, {
        method: 'PATCH',
        body: JSON.stringify({ lat: coords ? coords.latitude : undefined, lng: coords ? coords.longitude : undefined })
      });
      showToast('&#128075;', `Automatically clocked out of ${site.name}`);
      renderEmployee();
    }catch(err){ /* stay quiet */ }
    geoPromptShown = false;
    return;
  }

  geoPromptShown = true;
  const wantsClockOut = confirm(`You've left ${site.name}. Clock out now?`);
  if(wantsClockOut){
    await renderEmployee();
    setTimeout(() => {
      const btn = document.getElementById('clock-out-btn');
      if(btn) handleClockOut();
    }, 50);
  }
  geoPromptShown = false;
}

function addMapViewToggle(map){
  const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd' });
  const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
  lightLayer.addTo(map);
  let current = 'light';

  const ToggleControl = L.Control.extend({
    onAdd: function(){
      const div = L.DomUtil.create('div', 'map-view-toggle');
      div.innerHTML = `<button type="button" data-view="light" class="active">Map</button><button type="button" data-view="sat">Satellite</button>`;
      L.DomEvent.disableClickPropagation(div);
      const setActive = (view) => {
        div.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      };
      div.querySelector('[data-view="light"]').addEventListener('click', () => {
        if(current === 'light') return;
        map.removeLayer(satLayer);
        lightLayer.addTo(map);
        current = 'light';
        setActive('light');
      });
      div.querySelector('[data-view="sat"]').addEventListener('click', () => {
        if(current === 'sat') return;
        map.removeLayer(lightLayer);
        satLayer.addTo(map);
        current = 'sat';
        setActive('sat');
      });
      return div;
    }
  });
  map.addControl(new ToggleControl({ position: 'topright' }));
}

// Same idea as the employee-side geofence watch, but for whoever's logged
// into Admin with a linked time-tracking record (e.g. a manager who never
// uses the PIN screen). Runs while the Admin tab is open.
function startMyGeofenceWatch(){
  if(myGeoWatchId !== null || !navigator.geolocation) return;
  if(!account || !account.linkedEmployeeId) return;
  if((settings.autoMode || 'ask') === 'manual') return;
  myWasInsideAnySite = false;
  myWasInsideActiveSite = true;
  myGeoWatchId = navigator.geolocation.watchPosition(handleMyGeoUpdate, () => {}, {
    enableHighAccuracy: true, maximumAge: 20000, timeout: 25000
  });
}

function stopMyGeofenceWatch(){
  if(myGeoWatchId !== null){
    navigator.geolocation.clearWatch(myGeoWatchId);
    myGeoWatchId = null;
  }
}

function handleMyGeoUpdate(pos){
  if(myGeoPromptShown) return;
  const active = myActiveEntry();
  if(active){
    const site = sites.find(s => s.id === active.siteId);
    if(!site) return;
    const inside = clientDistance(pos.coords.latitude, pos.coords.longitude, site.lat, site.lng) <= site.radius;
    if(!inside && myWasInsideActiveSite){
      handleMySiteExit(site, active);
    }
    myWasInsideActiveSite = inside;
  } else {
    let found = false;
    for(const site of sites){
      const inside = clientDistance(pos.coords.latitude, pos.coords.longitude, site.lat, site.lng) <= site.radius;
      if(inside){
        found = true;
        if(!myWasInsideAnySite){
          handleMySiteEnter(site);
        }
        break;
      }
    }
    myWasInsideAnySite = found;
  }
}

async function handleMySiteEnter(site){
  myGeoPromptShown = true;
  const mode = settings.autoMode || 'ask';
  const doClockIn = async () => {
    try{ await api('/api/data?resource=entries', { method:'POST', body: JSON.stringify({ employeeId: account.linkedEmployeeId, siteId: site.id }) }); renderAdmin(); }catch(e){}
  };
  if(mode === 'auto'){
    await doClockIn();
  } else if(confirm(`You've arrived at ${site.name}. Clock in now?`)){
    await doClockIn();
  }
  myGeoPromptShown = false;
}

async function handleMySiteExit(site, active){
  myGeoPromptShown = true;
  const mode = settings.autoMode || 'ask';
  const doClockOut = async () => {
    try{ await api(`/api/data?resource=entries&id=${active.id}`, { method:'PATCH' }); renderAdmin(); }catch(e){}
  };
  if(mode === 'auto'){
    await doClockOut();
  } else if(confirm(`You've left ${site.name}. Clock out now?`)){
    await doClockOut();
  }
  myGeoPromptShown = false;
}

        const site = sites.find(s=>s.id===e.siteId);
        const hrs = e.clockOut ? hoursBetween(e.clockIn,e.clockOut).toFixed(2)+'h' : 'active';
        if(editingEntryId === e.id){
          return `<div class="entry-row" style="flex-direction:column;align-items:stretch;gap:8px;">
            <div class="entry-name">${escapeHtml(e.employee)} &middot; ${escapeHtml(site?site.name:'?')}</div>
            <label>Clock In</label>
            <input type="datetime-local" id="edit-entry-in-${e.id}" value="${toLocalInputValue(e.clockIn)}">
            <label>Clock Out ${e.clockOut ? '' : '<span class="entry-meta">(currently still clocked in)</span>'}</label>
            <input type="datetime-local" id="edit-entry-out-${e.id}" value="${e.clockOut ? toLocalInputValue(e.clockOut) : ''}">
            <div id="edit-entry-error-${e.id}"></div>
            <div class="row2">
              <button class="btn btn-gold btn-sm" data-save-entry="${e.id}">Save</button>
              <button class="btn btn-outline btn-sm" data-cancel-entry-edit="${e.id}">Cancel</button>
            </div>
          </div>`;
        }
        return `<div class="entry-row">
          <div class="entry-left" style="display:flex;align-items:center;gap:10px;">
            ${e.photo ? `<a href="${e.photo}" target="_blank" rel="noopener"><img src="${e.photo}" style="width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;"></a>` : ''}
            <div>
              <div class="entry-name">${escapeHtml(e.employee)}</div>
              <div class="entry-meta">${escapeHtml(site?site.name:'?')} &middot; ${fmtDate(e.clockIn)} ${fmtTime(e.clockIn)}${e.clockOut ? ' &rarr; '+fmtTime(e.clockOut):''} ${e.editedByAdmin ? '<span style="color:var(--gold);">&middot; edited</span>' : ''}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="entry-hours">${hrs}</div>
            ${!e.clockOut ? `<button class="btn btn-red btn-sm" data-quick-clockout="${e.id}">Clock Out</button>` : ''}
            <button class="btn btn-outline btn-sm" data-edit-entry="${e.id}">Edit</button>
            <button class="btn btn-outline btn-sm" data-delete-entry="${e.id}">&times;</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  wireDashboardEvents(el);
}

  document.querySelectorAll('[data-link-manager]').forEach(b => {

  document.querySelectorAll('[data-reset-manager]').forEach(b => {

  const showRedeemLink = document.getElementById('show-redeem');

  if(redeemBtn){

      redeemBtn.textContent = 'Checking...';
      try{
        await api('/api/redeem', { method:'POST', body: JSON.stringify({ code }) });

        renderAdmin();
      }catch(err){
        errEl.innerHTML = `<div class="msg msg-error">${escapeHtml(err.message)}</div>`;
        redeemBtn.disabled = false;
        redeemBtn.textContent = 'Unlock';
      }
    });
  }

  let pendingCoords = null;

  // Set up the interactive map. Default view is a wide US shot until the
  // admin taps the map, drags the pin, uses their location, or searches an
  // address - all three feed into the same marker + geofence circle.
  if(siteMapInstance){ siteMapInstance.remove(); siteMapInstance = null; }
  siteMapInstance = L.map('new-site-map', { attributionControl: false }).setView([39.8283, -98.5795], 4);
  addMapViewToggle(siteMapInstance);
  L.control.attribution({ prefix: false }).addTo(siteMapInstance).addAttribution('&copy; OpenStreetMap &copy; CARTO &copy; Esri');
  siteMapMarker = null;
  siteMapCircle = null;

  function currentRadiusMeters(){
    const ft = parseInt(document.getElementById('new-site-radius').value, 10) || 300;
    return feetToMeters(ft);
  }

  function setMapPin(lat, lng, recenter){
    pendingCoords = { lat, lng };
    if(!siteMapMarker){
      siteMapMarker = L.marker([lat, lng], { draggable: true }).addTo(siteMapInstance);
      siteMapMarker.on('dragend', () => {
        const pos = siteMapMarker.getLatLng();
        setMapPin(pos.lat, pos.lng, false);
      });
      siteMapCircle = L.circle([lat, lng], {
        radius: currentRadiusMeters(), color: '#d4af37', fillColor: '#d4af37', fillOpacity: 0.15, weight: 2
      }).addTo(siteMapInstance);
    } else {
      siteMapMarker.setLatLng([lat, lng]);
      siteMapCircle.setLatLng([lat, lng]);
    }
    if(recenter){ siteMapInstance.setView([lat, lng], 16); }
    document.getElementById('new-site-coords').textContent = `Pin set: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    document.getElementById('add-site-btn').disabled = false;
  }

  siteMapInstance.on('click', (e) => setMapPin(e.latlng.lat, e.latlng.lng, false));

  const radiusInput = document.getElementById('new-site-radius');
  if(radiusInput){
    radiusInput.addEventListener('input', () => {
      if(siteMapCircle) siteMapCircle.setRadius(currentRadiusMeters());
    });
  }

  document.getElementById('use-current-loc').addEventListener('click', async () => {
    const coordEl = document.getElementById('new-site-coords');
    document.getElementById('address-matches').innerHTML = '';
    coordEl.innerHTML = `<span class="spinner"></span> Getting location...`;
    try{
      const coords = await getPosition();
      setMapPin(coords.latitude, coords.longitude, true);
    }catch(err){
      coordEl.innerHTML = `<span style="color:var(--red);">${escapeHtml(err.message)}</span>`;
    }
  });

  document.getElementById('lookup-address-btn').addEventListener('click', async () => {
    const addressInput = document.getElementById('new-site-address');
    const address = addressInput.value.trim();
    const matchesEl = document.getElementById('address-matches');
    const coordEl = document.getElementById('new-site-coords');
    if(!address) return;
    matchesEl.innerHTML = `<div class="entry-meta"><span class="spinner"></span> Looking up address...</div>`;
    coordEl.innerHTML = '';
    try{
      const data = await api(`/api/geocode?address=${encodeURIComponent(address)}`);
      if(data.matches.length === 1){
        setMapPin(data.matches[0].lat, data.matches[0].lng, true);
        matchesEl.innerHTML = '';
      } else {
        matchesEl.innerHTML = `
          <div class="entry-meta" style="margin-bottom:8px;">Multiple matches found &mdash; pick the right one:</div>
          <div class="pick-list">
            ${data.matches.map((m,i) => `<button class="pick-btn" data-match-index="${i}" style="font-size:14px;padding:12px 14px;">${escapeHtml(m.displayName)}</button>`).join('')}
          </div>`;
        data.matches.forEach((m, i) => {
          document.querySelector(`[data-match-index="${i}"]`).addEventListener('click', () => {
            setMapPin(m.lat, m.lng, true);
            matchesEl.innerHTML = '';
          });
        });
      }
    }catch(err){
      matchesEl.innerHTML = `<div class="msg msg-error">${escapeHtml(err.message)}</div>`;
    }

    await api('/api/data?resource=sites', { method:'POST', body: JSON.stringify({ name, lat: pendingCoords.lat, lng: pendingCoords.lng, radius: feetToMeters(radiusFt) }) });

  document.querySelectorAll('[data-delete-site]').forEach(b => {

      renderAdmin();
    });
  });

  document.querySelectorAll('[data-edit-site]').forEach(b => {
    b.addEventListener('click', () => { editingSiteId = b.dataset.editSite; renderDashboard(el); });
  });
  document.querySelectorAll('[data-cancel-edit]').forEach(b => {
    b.addEventListener('click', () => { editingSiteId = null; renderDashboard(el); });
  });

  if(editingSiteId){
    const editSite = sites.find(s => s.id === editingSiteId);
    const mapContainer = document.getElementById(`edit-map-${editingSiteId}`);
    if(editSite && mapContainer){
      const emap = L.map(mapContainer, { attributionControl: false }).setView([editSite.lat, editSite.lng], 16);
      addMapViewToggle(emap);
      L.control.attribution({ prefix: false }).addTo(emap).addAttribution('&copy; OpenStreetMap &copy; CARTO &copy; Esri');
      const emarker = L.marker([editSite.lat, editSite.lng], { draggable: true }).addTo(emap);
      const ecircle = L.circle([editSite.lat, editSite.lng], {
        radius: editSite.radius, color: '#d4af37', fillColor: '#d4af37', fillOpacity: 0.15, weight: 2
      }).addTo(emap);

      async function applyEditPin(lat, lng){
        emarker.setLatLng([lat, lng]);
        ecircle.setLatLng([lat, lng]);
        try{
          await api(`/api/data?resource=sites&id=${editingSiteId}`, { method:'PUT', body: JSON.stringify({ lat, lng }) });
          editSite.lat = lat;
          editSite.lng = lng;
        }catch(err){
          alert(err.message);
        }
      }

      emarker.on('dragend', () => { const p = emarker.getLatLng(); applyEditPin(p.lat, p.lng); });
      emap.on('click', (e) => applyEditPin(e.latlng.lat, e.latlng.lng));

      const editRadiusInput = document.getElementById(`edit-radius-${editingSiteId}`);
      if(editRadiusInput){
        editRadiusInput.addEventListener('input', () => {

  document.querySelectorAll('[data-recapture-site]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.recaptureSite;

        const coords = await getPosition();

  document.querySelectorAll('[data-lookup-site]').forEach(b => {

          await applyMatch(data.matches[0]);
        } else {
          matchesEl.innerHTML = `
            <div class="entry-meta" style="margin:8px 0;">Pick the right one:</div>

          data.matches.forEach((m, i) => {

        matchesEl.innerHTML = `<div class="msg msg-error">${escapeHtml(err.message)}</div>`;

  document.querySelectorAll('[data-save-site]').forEach(b => {

      await api(`/api/data?resource=sites&id=${id}`, { method:'PUT', body: JSON.stringify({ name, radius: feetToMeters(radiusFt) }) });
      editingSiteId = null;
      renderAdmin();
    });

  document.getElementById('toggle-photo').addEventListener('click', async () => {
    settings.requirePhotoOnClockIn = !settings.requirePhotoOnClockIn;
    await api('/api/data?resource=settings', { method:'PATCH', body: JSON.stringify({ requirePhotoOnClockIn: settings.requirePhotoOnClockIn }) });
    renderAdmin();
  });

  document.querySelectorAll('[data-set-mode]').forEach(el2 => {
    el2.addEventListener('click', async () => {
      settings.autoMode = el2.dataset.setMode;
      await api('/api/data?resource=settings', { method:'PATCH', body: JSON.stringify({ autoMode: settings.autoMode }) });
      renderAdmin();
    });
  });

  document.querySelectorAll('[data-delete-entry]').forEach(b => {
    b.addEventListener('click', async () => {
      if(!confirm("Delete this entry?")) return;
      await api(`/api/data?resource=entries&id=${b.dataset.deleteEntry}`, { method:'DELETE' });
      renderAdmin();
    });
  });

  document.querySelectorAll('[data-edit-entry]').forEach(b => {
    b.addEventListener('click', () => { editingEntryId = b.dataset.editEntry; renderDashboard(el); });
  });
  document.querySelectorAll('[data-cancel-entry-edit]').forEach(b => {
    b.addEventListener('click', () => { editingEntryId = null; renderDashboard(el); });
  });
  document.querySelectorAll('[data-save-entry]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.saveEntry;
      const inVal = document.getElementById(`edit-entry-in-${id}`).value;
      const outVal = document.getElementById(`edit-entry-out-${id}`).value;
      const errEl = document.getElementById(`edit-entry-error-${id}`);
      if(!inVal){ errEl.innerHTML = `<div class="msg msg-error">Clock-in time is required.</div>`; return; }
      try{
        await api(`/api/data?resource=entries&id=${id}`, {
          method: 'PUT',
          body: JSON.stringify({ clockIn: new Date(inVal).toISOString(), clockOut: outVal ? new Date(outVal).toISOString() : null })
        });
        editingEntryId = null;
        renderAdmin();
      }catch(err){
        errEl.innerHTML = `<div class="msg msg-error">${escapeHtml(err.message)}</div>`;
      }
    });
  });

  document.getElementById('export-csv').addEventListener('click', (ev) => {
    ev.preventDefault();
    const allEntriesSorted = [...entries].sort((a,b) => new Date(b.clockIn) - new Date(a.clockIn));
    const rows = [["Employee","Site","Clock In","Clock Out","Hours"]];
    allEntriesSorted.forEach(e => {
      const site = sites.find(s=>s.id===e.siteId);
      rows.push([e.employee, site?site.name:"", e.clockIn, e.clockOut||"", e.clockOut?hoursBetween(e.clockIn,e.clockOut).toFixed(2):""]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'geoclock-timesheet.csv'; a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('export-pdf').addEventListener('click', (ev) => {
    ev.preventDefault();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const byEmployeePdf = {};
    entries.forEach(e => { if(!e.clockOut) return; byEmployeePdf[e.employee] = (byEmployeePdf[e.employee]||0) + hoursBetween(e.clockIn,e.clockOut); });
    const summaryRows = Object.entries(byEmployeePdf).sort((a,b)=>b[1]-a[1]).map(([name,hrs]) => [name, hrs.toFixed(2)]);
    const totalAll = Object.values(byEmployeePdf).reduce((a,b)=>a+b,0);

    doc.setFontSize(18);
    doc.setTextColor(20,25,45);
    doc.text('GeoClock Payroll Report', 14, 18);
    doc.setFontSize(11);
    doc.setTextColor(90,95,110);
    doc.text(`${account.businessName}`, 14, 26);
    doc.text(`Generated ${new Date().toLocaleString()}`, 14, 32);

    doc.autoTable({
      startY: 40,
      head: [['Employee', 'Total Hours']],
      body: summaryRows.length ? summaryRows : [['No completed shifts yet', '']],
      foot: [['Total', totalAll.toFixed(2)]],
      headStyles: { fillColor: [10, 17, 40] },
      footStyles: { fillColor: [212, 175, 55], textColor: [10,17,40], fontStyle: 'bold' },
      theme: 'striped'
    });

    const detailRows = [...entries].sort((a,b) => new Date(b.clockIn) - new Date(a.clockIn)).map(e => {
      const site = sites.find(s=>s.id===e.siteId);
      return [
        e.employee,
        site ? site.name : '',
        new Date(e.clockIn).toLocaleString(),
        e.clockOut ? new Date(e.clockOut).toLocaleString() : 'Active',
        e.clockOut ? hoursBetween(e.clockIn, e.clockOut).toFixed(2) : ''
      ];
    });

    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 12,
      head: [['Employee', 'Site', 'Clock In', 'Clock Out', 'Hours']],
      body: detailRows.length ? detailRows : [['No entries yet', '', '', '', '']],
      headStyles: { fillColor: [10, 17, 40] },
      styles: { fontSize: 8 },
      theme: 'striped'
    });

    doc.save('geoclock-payroll.pdf');
  });
}

// ---------- super admin (platform owner view, not a business admin) ----------
let superAdminKey = '';

function renderSuperAdminLogin(){
  const el = document.getElementById('super-admin-view');
  el.innerHTML = `
    <div class="card">
      <h2>Platform Signups</h2>
      <div class="entry-meta" style="margin-bottom:14px;">Enter your super admin key to see every business that's signed up.</div>
      <input type="password" id="sa-key-input" placeholder="Super admin key">
      <div id="sa-error"></div>
      <button class="btn btn-gold" id="sa-submit">View Signups</button>
    </div>
  `;
  document.getElementById('sa-submit').addEventListener('click', async () => {
    const val = document.getElementById('sa-key-input').value;
    const errEl = document.getElementById('sa-error');
    if(!val) return;
    superAdminKey = val;
    try{
      await renderSuperAdminDashboard();
    }catch(err){
      errEl.innerHTML = `<div class="msg msg-error">${escapeHtml(err.message)}</div>`;
      superAdminKey = '';
    }
  });
}

async function superAdminApi(path){
  const res = await fetch(path, { headers: { 'x-super-admin-key': superAdminKey } });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error((data && data.error) || 'Request failed');
    err.status = res.status;
    throw err;
  }
  return data;
}

async function renderSuperAdminDashboard(){
  const el = document.getElementById('super-admin-view');
  el.innerHTML = `<div class="card"><div class="empty-state"><span class="spinner"></span> Loading&hellip;</div></div>`;
  const data = await superAdminApi('/api/super-admin');

  el.innerHTML = `
    <div class="card">
      <h2>Platform Signups</h2>
      <div class="summary-grid">
        <div class="summary-box"><div class="num">${data.summary.total}</div><div class="lbl">Total Signups</div></div>
        <div class="summary-box"><div class="num">${data.summary.trial}</div><div class="lbl">On Trial</div></div>
        <div class="summary-box"><div class="num">${data.summary.subscribed}</div><div class="lbl">Subscribed</div></div>
        <div class="summary-box"><div class="num">${data.summary.expired}</div><div class="lbl">Trial Expired</div></div>
      </div>
      <a href="#" class="export-link" id="sa-refresh">&#8635; Refresh</a>
    </div>
    <div class="card">
      ${data.accounts.length === 0 ? `<div class="empty-state">No signups yet.</div>` : data.accounts.map(a => `
        <div class="entry-row">
          <div class="entry-left">
            <div class="entry-name">${escapeHtml(a.businessName)}</div>
            <div class="entry-meta">${escapeHtml(a.email)} &middot; ${a.employeeCount} employee${a.employeeCount===1?'':'s'} &middot; ${fmtDate(a.createdAt)}</div>
          </div>
          <div>${planPillHtml(a.plan)}</div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('sa-refresh').addEventListener('click', (ev) => {
    ev.preventDefault();
    renderSuperAdminDashboard();
  });
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const which = tab.dataset.tab;
    document.getElementById('employee-view').style.display = which === 'employee' ? 'block' : 'none';
    document.getElementById('admin-view').style.display = which === 'admin' ? 'block' : 'none';
    if(which === 'admin') renderAdmin();
  });
});

// ---------- init ----------
(function init(){
  const params = new URLSearchParams(location.search);
  const tabBar = document.getElementById('tab-bar');

  if(params.get('superadmin') === '1'){
    if(tabBar) tabBar.style.display = 'none';
    document.getElementById('employee-view').style.display = 'none';
    document.getElementById('admin-view').style.display = 'none';
    document.getElementById('super-admin-view').style.display = 'block';
    renderSuperAdminLogin();
    return;
  }

  // Restore a mid-shift session if one was saved (see syncSessionPersistence) -
  // only valid for the same company link, and only ever exists while someone
  // was actually clocked in when the tab/app last closed.
  if(companyCode){
    try{
      const saved = JSON.parse(localStorage.getItem('gc_active_session') || 'null');
      if(saved && saved.companyCode === companyCode){
        employeeToken = saved.employeeToken;
        employeeId = saved.employeeId;
        employeeName = saved.employeeName;
      }
    }catch(e){ /* ignore malformed storage */ }
  }

  renderInstallBanner();

  if(params.get('paid') === '1'){
    document.querySelector('.tab[data-tab="admin"]').click();
  } else if(params.get('signup') === '1'){
    adminScreen = 'signup';
    document.querySelector('.tab[data-tab="admin"]').click();
  } else if (companyCode) {
    // Someone arrived via a plain employee clock-in link (?company=CODE).
    // Employees should only ever see the clock-in screen - no Admin tab,
    // no way to even discover it's there. Admin access lives at the bare
    // app URL (or the ?signup=1 / ?paid=1 links), never here.
    if(tabBar) tabBar.style.display = 'none';
    document.querySelector('.tab[data-tab="employee"]').classList.add('active');
    document.querySelector('.tab[data-tab="admin"]').classList.remove('active');
    renderEmployee();
  } else {
    renderEmployee();
  }
})();
</script>
